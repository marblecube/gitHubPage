<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Firecracker Media</title>
  <link rel="stylesheet" href="css/index.css">
  <meta name="author" content="Vidal Palacios">
  <meta name="description" content="404 Error - Page Not Found">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
  <!-- Header -->
  <header class="header" style="height: 10vh; z-index: 100; position: relative; background: transparent; padding-top: var(--space-md);">
    <div class="landing-content" style="padding: 0 var(--space-md);">
      <nav class="animate-fade-in">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#about-anchor-link">About</a></li>
          <li><a href="index.html#projects-anchor-link">Projects</a></li>
          <li><a href="index.html#portfolio-anchor-link">Portfolio</a></li>
          <li><a href="index.html#socials-anchor-link">Socials</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main" style="flex: 1; display: flex; align-items: center; justify-content: center; position: relative;">
    
    <!-- Background Video for Atmosphere -->
    <div class="video-wrapper" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;">
      <video playsinline autoplay muted loop poster="./assets/firecracker_static.png" style="opacity: 0.15; width: 100%; height: 100%; object-fit: cover;">
        <source src="assets/firecracker.webm" type="video/webm">
        <source src="assets/firecracker.mp4" type="video/mp4">
      </video>
    </div>

    <section class="container" style="text-align: center;">
      <div class="glass-card hover-glow animate-fade-in" style="max-width: 600px; margin: 0 auto; padding: var(--space-lg) var(--space-md);">
        <h1 style="font-size: 5rem; color: var(--accent-primary); margin-bottom: var(--space-xs); line-height: 1;">404</h1>
        <h2 style="font-size: 2rem; margin-bottom: var(--space-md);">Lost in the static...</h2>
        <p style="color: var(--text-secondary); margin-bottom: var(--space-lg); font-size: 1.1rem;">
          The page you're looking for doesn't exist or has been moved. It looks like it went out with a bang.
        </p>
        <a href="index.html" class="hover-scale" style="display: inline-block; padding: var(--space-sm) var(--space-md); background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: #fff; border-radius: 30px; font-weight: bold; font-family: var(--font-display); box-shadow: 0 4px 15px var(--accent-primary-glow);">
          Return to Homepage
        </a>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer" style="margin-top: auto;">
    <p>&#169; 2024 Firecracker Media</p>
  </footer>
</body>
</html>
